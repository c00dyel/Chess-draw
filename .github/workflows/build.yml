          package com.chessdraw

          import android.animation.ObjectAnimator
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import android.widget.ImageView
          import kotlin.math.*

          // Jelly / liquid spring on any view: swell on press, wobble back on release
          class Jelly(private val v: View) {
              private var anim: ValueAnimator? = null

              private fun ring(t: Float, w: Float): Float = exp(-5.5f * t) * cos(w * t)

              fun press() {
                  anim?.cancel()
                  v.animate().cancel()
                  v.animate().scaleX(1.22f).scaleY(1.22f).setDuration(130).setInterpolator(OvershootInterpolator(2f)).start()
              }

              fun release(base: Float) {
                  anim?.cancel()
                  v.animate().cancel()
                  val ax = max(v.scaleX - base, 0.14f)
                  val ay = max(v.scaleY - base, 0.14f)
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 700
                  a.addUpdateListener {
                      val t = it.animatedValue as Float
                      v.scaleX = base + ax * ring(t, 14f)
                      v.scaleY = base + ay * ring(t, 17f)
                  }
                  anim = a
                  a.start()
              }
          }

          // Toolbar button with a glass blob behind the icon and liquid animation
          class LiquidButton(c: Context, box: Int, innerPx: Int, val inner: View) : FrameLayout(c) {
              private val glow = View(c)
              private val jelly = Jelly(this)
              private var base = 1f
              private var active = false
              private var moved = false
              private var x0 = 0f
              private var y0 = 0f
              var slop = 8f * c.resources.displayMetrics.density
              var onTap: (() -> Unit)? = null
              var drag: ((MotionEvent, Boolean) -> Unit)? = null

              init {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setGradientType(GradientDrawable.RADIAL_GRADIENT)
                  g.setGradientRadius(box / 2f)
                  g.setColors(intArrayOf(Color.parseColor("#22FFFFFF"), Color.parseColor("#77FFFFFF")))
                  g.setStroke(max(1, box / 28), Color.parseColor("#66FFFFFF"))
                  glow.background = g
                  glow.alpha = 0f
                  addView(glow, FrameLayout.LayoutParams(box, box, Gravity.CENTER))
                  addView(inner, FrameLayout.LayoutParams(innerPx, innerPx, Gravity.CENTER))
              }

              fun setActive(a: Boolean) {
                  active = a
                  base = if (a) 1.12f else 1f
                  glow.animate().alpha(if (a) 0.9f else 0f).setDuration(200).start()
                  animate().scaleX(base).scaleY(base).setDuration(220).setInterpolator(OvershootInterpolator(2f)).start()
              }

              private fun letGo() {
                  glow.animate().alpha(if (active) 0.9f else 0f).setDuration(350).start()
                  jelly.release(base)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          moved = false
                          x0 = e.rawX
                          y0 = e.rawY
                          glow.animate().alpha(1f).setDuration(100).start()
                          jelly.press()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (!moved && hypot(e.rawX - x0, e.rawY - y0) > slop) moved = true
                      }
                      MotionEvent.ACTION_UP -> {
                          letGo()
                          if (!moved && e.x >= 0f && e.y >= 0f && e.x <= width && e.y <= height) onTap?.invoke()
                      }
                      MotionEvent.ACTION_CANCEL -> letGo()
                  }
                  drag?.invoke(e, moved)
                  return true
              }
          }

          // Glass lens that magnifies the part of the artwork under a button
          class LensView(c: Context, private val bmp: Bitmap) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val glass = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rim = Paint(Paint.ANTI_ALIAS_FLAG)
              private val clip = Path()
              private val dst = RectF()

              init {
                  rim.style = Paint.Style.STROKE
                  rim.color = Color.parseColor("#99FFFFFF")
                  rim.strokeWidth = 2f * resources.displayMetrics.density
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  clip.rewind()
                  clip.addCircle(w / 2f, h / 2f, w / 2f - 1f, Path.Direction.CW)
                  dst.set(0f, 0f, w.toFloat(), h.toFloat())
                  glass.shader = RadialGradient(
                      w / 2f, h / 2f, w / 2f,
                      intArrayOf(Color.parseColor("#00FFFFFF"), Color.parseColor("#00FFFFFF"), Color.parseColor("#66FFFFFF")),
                      floatArrayOf(0f, 0.6f, 1f), Shader.TileMode.CLAMP
                  )
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  c.save()
                  c.clipPath(clip)
                  c.drawBitmap(bmp, null, dst, p)
                  c.drawCircle(w / 2f, h / 2f, w / 2f, glass)
                  c.restore()
                  c.drawCircle(w / 2f, h / 2f, w / 2f - 1f, rim)
              }
          }

          // Design is 1080 x 1917. Lens hit zones sit on top of the baked-in icons.
          class Stage(c: Context) : FrameLayout(c) {
              private val iw = 1080f
              private val ih = 1917f
              val bg = ImageView(c)
              private var art: Bitmap? = null
              private val hits = ArrayList<Pair<View, FloatArray>>()

              init {
                  setBackgroundColor(Color.BLACK)
                  bg.scaleType = ImageView.ScaleType.FIT_CENTER
                  addView(bg)
              }

              fun setArt(b: Bitmap) {
                  art = b
                  bg.setImageBitmap(b)
              }

              fun addHit(cx: Float, cy: Float, half: Float, action: () -> Unit) {
                  val b = art ?: return
                  val k = b.width / iw
                  val sz = (half * 2f * k).toInt()
                  val x = ((cx - half) * k).toInt().coerceIn(0, b.width - sz)
                  val y = ((cy - half) * k).toInt().coerceIn(0, b.height - sz)
                  val v = LensView(context, Bitmap.createBitmap(b, x, y, sz, sz))
                  val jelly = Jelly(v)
                  var fade: ObjectAnimator? = null
                  v.alpha = 0f
                  v.setOnTouchListener { view, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              fade?.cancel()
                              view.alpha = 1f
                              jelly.press()
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              jelly.release(1f)
                              val f = ObjectAnimator.ofFloat(view, View.ALPHA, 1f, 0f)
                              f.startDelay = 250
                              f.duration = 350
                              fade = f
                              f.start()
                              if (e.actionMasked == MotionEvent.ACTION_UP && e.x >= 0f && e.y >= 0f && e.x <= view.width && e.y <= view.height) action()
                          }
                      }
                      true
                  }
                  addView(v)
                  hits.add(Pair(v, floatArrayOf(cx - half, cy - half, cx + half, cy + half)))
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(MeasureSpec.getSize(w), MeasureSpec.getSize(h))
              }

              override fun onLayout(changed: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val w = r - l
                  val h = b - t
                  bg.measure(MeasureSpec.makeMeasureSpec(w, MeasureSpec.EXACTLY), MeasureSpec.makeMeasureSpec(h, MeasureSpec.EXACTLY))
                  bg.layout(0, 0, w, h)
                  val s = min(w / iw, h / ih)
                  val ox = (w - iw * s) / 2f
                  val oy = (h - ih * s) / 2f
                  for ((v, rc) in hits) {
                      val x1 = (ox + rc[0] * s).toInt()
                      val y1 = (oy + rc[1] * s).toInt()
                      val x2 = (ox + rc[2] * s).toInt()
                      val y2 = (oy + rc[3] * s).toInt()
                      v.measure(MeasureSpec.makeMeasureSpec(x2 - x1, MeasureSpec.EXACTLY), MeasureSpec.makeMeasureSpec(y2 - y1, MeasureSpec.EXACTLY))
                      v.layout(x1, y1, x2, y2)
                  }
              }
          }
