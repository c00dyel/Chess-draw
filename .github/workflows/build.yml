          package com.chessdraw

          import android.app.Activity
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.widget.Toast
          import android.view.animation.DecelerateInterpolator

          class MainActivity : Activity() {
              private fun askOverlayPermission() {
                  Toast.makeText(this, "فعّل صلاحية العرض فوق التطبيقات عشان الرسم يشتغل", Toast.LENGTH_LONG).show()
                  startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK
                  val st = Stage(this)
                  st.setArt(
                      BitmapFactory.decodeResource(resources, R.drawable.bg_main),
                      BitmapFactory.decodeResource(resources, R.drawable.bg_fill)
                  )
                  var starting = false

                  // bar: x 30..1055, y 1857..2081 in the 1080-wide design
                  st.setBar(
                      30f, 1857f, 1055f, 2081f, 30f,
                      listOf(
                          // TikTok (globe)
                          BarItem(199f, 150f) {
                              try {
                                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.tiktok.com/@iyousvv")))
                              } catch (e: Exception) {
                                  Toast.makeText(this, "تعذر فتح الرابط", Toast.LENGTH_SHORT).show()
                              }
                          },
                          // Start (arrow): waits 2 seconds, then launches the overlay
                          BarItem(527f, 150f) {
                              if (!starting) {
                                  if (!Settings.canDrawOverlays(this)) {
                                      askOverlayPermission()
                                  } else {
                                      starting = true
                                      st.animate().alpha(0f).setStartDelay(1500).setDuration(500).start()
                                      Handler(Looper.getMainLooper()).postDelayed({
                                          if (!isFinishing) {
                                              try {
                                                  startForegroundService(Intent(this, OverlayService::class.java))
                                              } catch (e: Exception) {
                                              }
                                              finish()
                                          }
                                      }, 2000)
                                  }
                              }
                          },
                          // Exit
                          BarItem(868f, 150f) {
                              stopService(Intent(this, OverlayService::class.java))
                              finishAffinity()
                          }
                      )
                  )

                  setContentView(st)

                  // entrance animation
                  st.alpha = 0f
                  st.translationY = 60f
                  st.animate().alpha(1f).translationY(0f).setDuration(700).setInterpolator(DecelerateInterpolator()).start()

                  // ask for the overlay permission on first open
                  if (b == null && !Settings.canDrawOverlays(this)) {
                      Handler(Looper.getMainLooper()).postDelayed({
                          if (!isFinishing && !Settings.canDrawOverlays(this)) askOverlayPermission()
                      }, 900)
                  }
              }
          }
