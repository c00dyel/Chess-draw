name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/chessdraw
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ChessDraw"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.chessdraw"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.chessdraw"
                  minSdk = 26
                  targetSdk = 30
                  versionCode = 3
                  versionName = "3.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Chess Draw" android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false"/>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/chessdraw/MainActivity.kt <<'EOF'
          package com.chessdraw

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = (24 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  root.setPadding(p, p * 2, p, p)
                  val tv = TextView(this)
                  tv.textSize = 16f
                  tv.text = "رسام أسهم الشطرنج فوق أي تطبيق.\n\n" +
                      "1) فعّل صلاحية العرض فوق التطبيقات الأخرى.\n" +
                      "2) اضغط ابدأ، وافتح برنامج الشطرنج.\n" +
                      "3) من الشريط العائم: ✏️ يشغّل/يوقف الرسم (وهو متوقف تلعب عادي)، ↩ تراجع، 🗑 مسح، ● لون، ✥ اسحبه لتحريك الشريط، ✕ إغلاق.\n\n" +
                      "ارسم بإصبعك: خط مستقيم أو قطري يتحول لسهم، وحرف L يتحول لسهم حصان."
                  root.addView(tv)
                  val b1 = Button(this)
                  b1.text = "1) تفعيل الصلاحية"
                  b1.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  root.addView(b1)
                  val b2 = Button(this)
                  b2.text = "2) ابدأ"
                  b2.setOnClickListener {
                      if (Settings.canDrawOverlays(this)) {
                          startForegroundService(Intent(this, OverlayService::class.java))
                          finish()
                      } else {
                          Toast.makeText(this, "فعّل الصلاحية أولاً", Toast.LENGTH_LONG).show()
                      }
                  }
                  root.addView(b2)
                  setContentView(root)
              }
          }
          EOF
          cat > app/src/main/java/com/chessdraw/OverlayService.kt <<'EOF'
          package com.chessdraw

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.PointF
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.WindowManager.LayoutParams as LP
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.*

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var dv: DrawView? = null
              private var panel: View? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (dv != null) return START_NOT_STICKY
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("cd", "Chess Draw", NotificationManager.IMPORTANCE_LOW))
                  startForeground(1, Notification.Builder(this, "cd").setContentTitle("Chess Draw").setSmallIcon(android.R.drawable.ic_menu_edit).build())
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val d = resources.displayMetrics.density
                  val type = LP.TYPE_APPLICATION_OVERLAY
                  val fl = LP.FLAG_NOT_FOCUSABLE or LP.FLAG_LAYOUT_IN_SCREEN or LP.FLAG_LAYOUT_NO_LIMITS or LP.FLAG_HARDWARE_ACCELERATED
                  val dlp = LP(LP.MATCH_PARENT, LP.MATCH_PARENT, type, fl or LP.FLAG_NOT_TOUCHABLE, PixelFormat.TRANSLUCENT)
                  dlp.gravity = Gravity.TOP or Gravity.START
                  dlp.alpha = 0.8f
                  val v = DrawView(this)
                  dv = v
                  wm.addView(v, dlp)

                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setBackgroundColor(Color.parseColor("#CC222222"))
                  panel = col
                  val plp = LP(LP.WRAP_CONTENT, LP.WRAP_CONTENT, type, fl, PixelFormat.TRANSLUCENT)
                  plp.gravity = Gravity.TOP or Gravity.START
                  plp.y = (200 * d).toInt()

                  fun btn(t: String, click: (TextView) -> Unit): TextView {
                      val b = TextView(this)
                      b.text = t
                      b.textSize = 22f
                      b.setTextColor(Color.WHITE)
                      b.gravity = Gravity.CENTER
                      val p = (12 * d).toInt()
                      b.setPadding(p, p * 2 / 3, p, p * 2 / 3)
                      b.setOnClickListener { click(b) }
                      col.addView(b)
                      return b
                  }

                  val h = btn("✥") { }
                  var sx = 0
                  var sy = 0
                  var tx = 0f
                  var ty = 0f
                  h.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { sx = plp.x; sy = plp.y; tx = e.rawX; ty = e.rawY }
                          MotionEvent.ACTION_MOVE -> {
                              plp.x = sx + (e.rawX - tx).toInt()
                              plp.y = sy + (e.rawY - ty).toInt()
                              wm.updateViewLayout(col, plp)
                          }
                      }
                      true
                  }
                  var on = false
                  btn("✏️") { b ->
                      on = !on
                      dlp.flags = if (on) dlp.flags and LP.FLAG_NOT_TOUCHABLE.inv() else dlp.flags or LP.FLAG_NOT_TOUCHABLE
                      wm.updateViewLayout(v, dlp)
                      b.setBackgroundColor(if (on) Color.parseColor("#3B82F6") else Color.TRANSPARENT)
                  }
                  btn("↩") { v.undo() }
                  btn("🗑") { v.clear() }
                  val cb = btn("●") { b ->
                      v.colorIdx = (v.colorIdx + 1) % 4
                      b.setTextColor(v.curColor())
                  }
                  cb.setTextColor(v.curColor())
                  btn("✕") { stopSelf() }
                  wm.addView(col, plp)
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  dv?.let { wm.removeView(it) }
                  panel?.let { wm.removeView(it) }
                  super.onDestroy()
              }
          }

          class DrawView(c: Context) : View(c) {
              class Arrow(val pts: List<PointF>, val color: Int)

              private val d = resources.displayMetrics.density
              private val arrows = mutableListOf<Arrow>()
              private val colors = intArrayOf(Color.parseColor("#F59E0B"), Color.parseColor("#22C55E"), Color.parseColor("#EF4444"), Color.parseColor("#3B82F6"))
              var colorIdx = 0
              private val raw = mutableListOf<PointF>()
              private var cur: List<PointF>? = null
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 12 * d; strokeJoin = Paint.Join.ROUND }
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val head = Path()

              fun curColor(): Int = colors[colorIdx]
              fun undo() { if (arrows.isNotEmpty()) arrows.removeAt(arrows.size - 1); invalidate() }
              fun clear() { arrows.clear(); invalidate() }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { raw.clear(); raw.add(PointF(e.x, e.y)); cur = null }
                      MotionEvent.ACTION_MOVE -> {
                          val l = raw.last()
                          if (hypot(e.x - l.x, e.y - l.y) >= 3 * d) {
                              raw.add(PointF(e.x, e.y))
                              cur = recognize(raw)
                              invalidate()
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          raw.add(PointF(e.x, e.y))
                          val r = recognize(raw)
                          if (r != null) arrows.add(Arrow(r, colors[colorIdx]))
                          cur = null; raw.clear(); invalidate()
                      }
                      MotionEvent.ACTION_CANCEL -> { cur = null; raw.clear(); invalidate() }
                  }
                  return true
              }

              private fun pd(p: PointF, a: PointF, b: PointF): Float {
                  val dx = b.x - a.x
                  val dy = b.y - a.y
                  val l = hypot(dx, dy)
                  if (l == 0f) return hypot(p.x - a.x, p.y - a.y)
                  return abs(dy * p.x - dx * p.y + b.x * a.y - b.y * a.x) / l
              }

              private fun rdp(p: List<PointF>, eps: Float): List<PointF> {
                  if (p.size < 3) return p
                  var md = 0f
                  var mi = 0
                  for (i in 1 until p.size - 1) {
                      val dd = pd(p[i], p[0], p.last())
                      if (dd > md) { md = dd; mi = i }
                  }
                  if (md <= eps) return listOf(p[0], p.last())
                  val a = rdp(p.subList(0, mi + 1), eps)
                  val b = rdp(p.subList(mi, p.size), eps)
                  return a.dropLast(1) + b
              }

              // Turns a rough finger stroke into clean segments: straight / diagonal / L (knight)
              private fun recognize(r: List<PointF>): List<PointF>? {
                  if (r.size < 2) return null
                  var total = 0f
                  for (i in 1 until r.size) total += hypot(r[i].x - r[i - 1].x, r[i].y - r[i - 1].y)
                  if (total < 30 * d) return null
                  val v = rdp(r, max(14 * d, total * 0.07f)).toMutableList()
                  var i = 1
                  while (v.size > 2 && i < v.size) {
                      if (hypot(v[i].x - v[i - 1].x, v[i].y - v[i - 1].y) < 36 * d) {
                          if (i == v.size - 1) v.removeAt(i - 1) else v.removeAt(i)
                          i = 1
                      } else i++
                  }
                  if (v.size < 2) return null
                  val step = PI.toFloat() / 4f
                  val segK = ArrayList<Int>()
                  val segL = ArrayList<Float>()
                  for (j in 1 until v.size) {
                      val dx = v[j].x - v[j - 1].x
                      val dy = v[j].y - v[j - 1].y
                      val k = (Math.round(atan2(dy, dx) / step) + 8) % 8
                      val len = hypot(dx, dy)
                      if (segK.isNotEmpty() && segK.last() == k) segL[segL.size - 1] = segL.last() + len
                      else { segK.add(k); segL.add(len) }
                  }
                  if (segK.size == 2) {
                      val diff = (segK[1] - segK[0] + 8) % 8
                      if (diff == 2 || diff == 6) {
                          val l1 = segL[0]
                          val l2 = segL[1]
                          val ratio = max(l1, l2) / min(l1, l2)
                          if (ratio in 1.35f..3.5f) { if (l1 > l2) segL[1] = l1 / 2f else segL[0] = l2 / 2f }
                      }
                  }
                  var x = v[0].x
                  var y = v[0].y
                  val out = mutableListOf(PointF(x, y))
                  for (j in segK.indices) {
                      val a = segK[j] * step
                      x += segL[j] * cos(a)
                      y += segL[j] * sin(a)
                      out.add(PointF(x, y))
                  }
                  return out
              }

              private fun drawArr(c: Canvas, a: List<PointF>, col: Int, alpha: Int) {
                  line.color = col
                  fill.color = col
                  line.alpha = alpha
                  fill.alpha = alpha
                  val n = a.size
                  val e = a[n - 1]
                  val p = a[n - 2]
                  val l = hypot(e.x - p.x, e.y - p.y)
                  if (l == 0f) return
                  val ux = (e.x - p.x) / l
                  val uy = (e.y - p.y) / l
                  val hl = min(30 * d, l * 0.8f)
                  val bx = e.x - ux * hl
                  val by = e.y - uy * hl
                  path.rewind()
                  path.moveTo(a[0].x, a[0].y)
                  for (i in 1 until n - 1) path.lineTo(a[i].x, a[i].y)
                  path.lineTo(bx, by)
                  c.drawPath(path, line)
                  val w = hl * 0.55f
                  head.rewind()
                  head.moveTo(e.x, e.y)
                  head.lineTo(bx - uy * w, by + ux * w)
                  head.lineTo(bx + uy * w, by - ux * w)
                  head.close()
                  c.drawPath(head, fill)
              }

              override fun onDraw(c: Canvas) {
                  for (a in arrows) drawArr(c, a.pts, a.color, 255)
                  cur?.let { drawArr(c, it, colors[colorIdx], 140) }
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Chess Draw #${{ github.run_number }}" --notes "APK"
