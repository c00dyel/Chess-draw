          package com.chessdraw

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ValueAnimator
          import android.app.PendingIntent
          import android.graphics.drawable.GradientDrawable
          import android.view.ViewGroup
          import android.view.animation.AccelerateDecelerateInterpolator
          import android.widget.ImageView
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.PointF
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.WindowManager.LayoutParams as LP
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.*

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var dv: DrawView? = null
              private var panel: View? = null
              private var resetPen: (() -> Unit)? = null

              override fun onBind(i: Intent?): IBinder? = null

              private fun hideAll() {
                  resetPen?.invoke()
                  dv?.visibility = View.GONE
                  panel?.visibility = View.GONE
              }

              private fun showAll() {
                  dv?.visibility = View.VISIBLE
                  panel?.visibility = View.VISIBLE
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (dv != null) {
                      if (i?.action == "SHOW") showAll()
                      return START_NOT_STICKY
                  }
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("cd", "Chess Draw", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getService(
                      this, 0, Intent(this, OverlayService::class.java).setAction("SHOW"),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  startForeground(
                      1,
                      Notification.Builder(this, "cd").setContentTitle("Chess Draw")
                          .setContentText("اضغط لإظهار الأدوات")
                          .setSmallIcon(android.R.drawable.ic_menu_edit)
                          .setContentIntent(pi).build()
                  )
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val d = resources.displayMetrics.density
                  fun dp(x: Int): Int = (x * d).toInt()
                  val type = LP.TYPE_APPLICATION_OVERLAY
                  val fl = LP.FLAG_NOT_FOCUSABLE or LP.FLAG_LAYOUT_IN_SCREEN or LP.FLAG_LAYOUT_NO_LIMITS or LP.FLAG_HARDWARE_ACCELERATED
                  val dlp = LP(LP.MATCH_PARENT, LP.MATCH_PARENT, type, fl or LP.FLAG_NOT_TOUCHABLE, PixelFormat.TRANSLUCENT)
                  dlp.gravity = Gravity.TOP or Gravity.START
                  dlp.alpha = 0.8f
                  val v = DrawView(this)
                  dv = v
                  wm.addView(v, dlp)

                  // ---- toolbar ----
                  val box = dp(36)
                  val innerPx = dp(22)
                  val panelView = LinearLayout(this)
                  panelView.orientation = LinearLayout.VERTICAL
                  panelView.gravity = Gravity.CENTER_HORIZONTAL
                  panelView.setPadding(0, dp(5), 0, dp(5))
                  val bgd = GradientDrawable()
                  bgd.shape = GradientDrawable.RECTANGLE
                  bgd.cornerRadius = dp(30).toFloat()
                  bgd.setColor(Color.parseColor("#EE0A0A12"))
                  bgd.setStroke(dp(1), Color.parseColor("#33FFFFFF"))
                  panelView.background = bgd
                  panel = panelView
                  val plp = LP(LP.WRAP_CONTENT, LP.WRAP_CONTENT, type, fl, PixelFormat.TRANSLUCENT)
                  plp.gravity = Gravity.TOP or Gravity.START
                  plp.x = dp(6)
                  plp.y = dp(200)

                  val content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  content.gravity = Gravity.CENTER_HORIZONTAL
                  content.setPadding(0, dp(3), 0, dp(3))
                  val contentLp = LinearLayout.LayoutParams(dp(48), ViewGroup.LayoutParams.WRAP_CONTENT)

                  fun img(res: Int): ImageView {
                      val iv = ImageView(this)
                      iv.setImageResource(res)
                      iv.scaleType = ImageView.ScaleType.FIT_CENTER
                      return iv
                  }

                  fun lb(inner: View, size: Int): LiquidButton = LiquidButton(this, box, size, inner)

                  fun put(parent: LinearLayout, b: View) {
                      val lp = LinearLayout.LayoutParams(box, box)
                      lp.setMargins(0, dp(2), 0, dp(2))
                      parent.addView(b, lp)
                  }

                  val colorRes = intArrayOf(R.drawable.ic_color0, R.drawable.ic_color1, R.drawable.ic_color2, R.drawable.ic_color3)

                  // drag logic shared by the fold button and the drag handle
                  var sx = 0
                  var sy = 0
                  var tx = 0f
                  var ty = 0f
                  fun dragMove(e: MotionEvent, moved: Boolean) {
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = plp.x
                              sy = plp.y
                              tx = e.rawX
                              ty = e.rawY
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (moved) {
                                  plp.x = sx + (e.rawX - tx).toInt()
                                  plp.y = sy + (e.rawY - ty).toInt()
                                  wm.updateViewLayout(panelView, plp)
                              }
                          }
                      }
                  }

                  val foldBtn = lb(img(R.drawable.ic_fold), dp(24))
                  foldBtn.drag = { e, m -> dragMove(e, m) }
                  put(panelView, foldBtn)
                  panelView.addView(content, contentLp)

                  val handle = lb(img(R.drawable.ic_drag), dp(24))
                  handle.slop = 1f
                  handle.drag = { e, m -> dragMove(e, m) }
                  put(content, handle)

                  val pen = lb(img(R.drawable.ic_pen), innerPx)
                  put(content, pen)

                  val undo = lb(img(R.drawable.ic_undo), innerPx)
                  put(content, undo)

                  val trash = lb(img(R.drawable.ic_trash), innerPx)
                  put(content, trash)

                  val colorIc = img(colorRes[v.colorIdx])
                  val chip = GradientDrawable()
                  chip.shape = GradientDrawable.OVAL
                  chip.setColor(Color.parseColor("#F2FFFFFF"))
                  colorIc.background = chip
                  colorIc.setPadding(dp(2), dp(2), dp(2), dp(2))
                  val colorBtn = lb(colorIc, dp(26))
                  put(content, colorBtn)

                  val exitBtn = lb(img(R.drawable.ic_exit), dp(26))
                  put(content, exitBtn)

                  val xBtn = lb(img(R.drawable.ic_x), dp(20))
                  put(content, xBtn)

                  // pen: same touch-flag logic as before
                  var on = false
                  pen.onTap = {
                      on = !on
                      dlp.flags = if (on) dlp.flags and LP.FLAG_NOT_TOUCHABLE.inv() else dlp.flags or LP.FLAG_NOT_TOUCHABLE
                      wm.updateViewLayout(v, dlp)
                      pen.setActive(on)
                  }
                  resetPen = {
                      if (on) {
                          on = false
                          dlp.flags = dlp.flags or LP.FLAG_NOT_TOUCHABLE
                          wm.updateViewLayout(v, dlp)
                          pen.setActive(false)
                      }
                  }
                  undo.onTap = { v.undo() }
                  trash.onTap = { v.clear() }
                  colorBtn.onTap = {
                      v.colorIdx = (v.colorIdx + 1) % 4
                      colorIc.setImageResource(colorRes[v.colorIdx])
                  }
                  exitBtn.onTap = { stopSelf() }
                  xBtn.onTap = { hideAll() }

                  // fold / unfold with a spin, then the bar rolls up or down
                  var folded = false
                  var busy = false
                  var fullH = 0
                  fun setH(h: Int) {
                      contentLp.height = h
                      content.layoutParams = contentLp
                      wm.updateViewLayout(panelView, plp)
                  }
                  foldBtn.onTap = {
                      if (!busy) {
                          busy = true
                          val dir = if (folded) -360f else 360f
                          foldBtn.inner.animate().rotationBy(dir).setDuration(450)
                              .setInterpolator(AccelerateDecelerateInterpolator())
                              .withEndAction {
                                  if (!folded) {
                                      fullH = content.height
                                      val a = ValueAnimator.ofInt(fullH, 0)
                                      a.duration = 320
                                      a.interpolator = AccelerateDecelerateInterpolator()
                                      a.addUpdateListener { setH(it.animatedValue as Int) }
                                      a.addListener(object : AnimatorListenerAdapter() {
                                          override fun onAnimationEnd(an: Animator) {
                                              content.visibility = View.GONE
                                              folded = true
                                              busy = false
                                          }
                                      })
                                      a.start()
                                  } else {
                                      content.visibility = View.VISIBLE
                                      setH(0)
                                      val a = ValueAnimator.ofInt(0, fullH)
                                      a.duration = 320
                                      a.interpolator = AccelerateDecelerateInterpolator()
                                      a.addUpdateListener { setH(it.animatedValue as Int) }
                                      a.addListener(object : AnimatorListenerAdapter() {
                                          override fun onAnimationEnd(an: Animator) {
                                              setH(ViewGroup.LayoutParams.WRAP_CONTENT)
                                              folded = false
                                              busy = false
                                          }
                                      })
                                      a.start()
                                  }
                              }.start()
                      }
                  }

                  wm.addView(panelView, plp)
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  dv?.let { wm.removeView(it) }
                  panel?.let { wm.removeView(it) }
                  super.onDestroy()
              }
          }

          class DrawView(c: Context) : View(c) {
              class Arrow(val pts: List<PointF>, val color: Int)

              private val d = resources.displayMetrics.density
              private val arrows = mutableListOf<Arrow>()
              private val colors = intArrayOf(Color.parseColor("#F59E0B"), Color.parseColor("#22C55E"), Color.parseColor("#EF4444"), Color.parseColor("#3B82F6"))
              var colorIdx = 0
              private val raw = mutableListOf<PointF>()
              private var cur: List<PointF>? = null
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 12 * d; strokeJoin = Paint.Join.ROUND }
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val head = Path()

              fun curColor(): Int = colors[colorIdx]
              fun undo() { if (arrows.isNotEmpty()) arrows.removeAt(arrows.size - 1); invalidate() }
              fun clear() { arrows.clear(); invalidate() }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { raw.clear(); raw.add(PointF(e.x, e.y)); cur = null }
                      MotionEvent.ACTION_MOVE -> {
                          val l = raw.last()
                          if (hypot(e.x - l.x, e.y - l.y) >= 3 * d) {
                              raw.add(PointF(e.x, e.y))
                              cur = recognize(raw)
                              invalidate()
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          raw.add(PointF(e.x, e.y))
                          val r = recognize(raw)
                          if (r != null) arrows.add(Arrow(r, colors[colorIdx]))
                          cur = null; raw.clear(); invalidate()
                      }
                      MotionEvent.ACTION_CANCEL -> { cur = null; raw.clear(); invalidate() }
                  }
                  return true
              }

              private fun pd(p: PointF, a: PointF, b: PointF): Float {
                  val dx = b.x - a.x
                  val dy = b.y - a.y
                  val l = hypot(dx, dy)
                  if (l == 0f) return hypot(p.x - a.x, p.y - a.y)
                  return abs(dy * p.x - dx * p.y + b.x * a.y - b.y * a.x) / l
              }

              private fun rdp(p: List<PointF>, eps: Float): List<PointF> {
                  if (p.size < 3) return p
                  var md = 0f
                  var mi = 0
                  for (i in 1 until p.size - 1) {
                      val dd = pd(p[i], p[0], p.last())
                      if (dd > md) { md = dd; mi = i }
                  }
                  if (md <= eps) return listOf(p[0], p.last())
                  val a = rdp(p.subList(0, mi + 1), eps)
                  val b = rdp(p.subList(mi, p.size), eps)
                  return a.dropLast(1) + b
              }

              // Turns a rough finger stroke into clean segments: straight / diagonal / L (knight)
              private fun recognize(r: List<PointF>): List<PointF>? {
                  if (r.size < 2) return null
                  var total = 0f
                  for (i in 1 until r.size) total += hypot(r[i].x - r[i - 1].x, r[i].y - r[i - 1].y)
                  if (total < 30 * d) return null
                  val v = rdp(r, max(14 * d, total * 0.07f)).toMutableList()
                  var i = 1
                  while (v.size > 2 && i < v.size) {
                      if (hypot(v[i].x - v[i - 1].x, v[i].y - v[i - 1].y) < 36 * d) {
                          if (i == v.size - 1) v.removeAt(i - 1) else v.removeAt(i)
                          i = 1
                      } else i++
                  }
                  if (v.size < 2) return null
                  val step = PI.toFloat() / 4f
                  val segK = ArrayList<Int>()
                  val segL = ArrayList<Float>()
                  for (j in 1 until v.size) {
                      val dx = v[j].x - v[j - 1].x
                      val dy = v[j].y - v[j - 1].y
                      val k = (Math.round(atan2(dy, dx) / step) + 8) % 8
                      val len = hypot(dx, dy)
                      if (segK.isNotEmpty() && segK.last() == k) segL[segL.size - 1] = segL.last() + len
                      else { segK.add(k); segL.add(len) }
                  }
                  if (segK.size == 2) {
                      val diff = (segK[1] - segK[0] + 8) % 8
                      if (diff == 2 || diff == 6) {
                          val l1 = segL[0]
                          val l2 = segL[1]
                          val ratio = max(l1, l2) / min(l1, l2)
                          if (ratio in 1.35f..3.5f) { if (l1 > l2) segL[1] = l1 / 2f else segL[0] = l2 / 2f }
                      }
                  }
                  var x = v[0].x
                  var y = v[0].y
                  val out = mutableListOf(PointF(x, y))
                  for (j in segK.indices) {
                      val a = segK[j] * step
                      x += segL[j] * cos(a)
                      y += segL[j] * sin(a)
                      out.add(PointF(x, y))
                  }
                  return out
              }

              private fun drawArr(c: Canvas, a: List<PointF>, col: Int, alpha: Int) {
                  line.color = col
                  fill.color = col
                  line.alpha = alpha
                  fill.alpha = alpha
                  val n = a.size
                  val e = a[n - 1]
                  val p = a[n - 2]
                  val l = hypot(e.x - p.x, e.y - p.y)
                  if (l == 0f) return
                  val ux = (e.x - p.x) / l
                  val uy = (e.y - p.y) / l
                  val hl = min(30 * d, l * 0.8f)
                  val bx = e.x - ux * hl
                  val by = e.y - uy * hl
                  path.rewind()
                  path.moveTo(a[0].x, a[0].y)
                  for (i in 1 until n - 1) path.lineTo(a[i].x, a[i].y)
                  path.lineTo(bx, by)
                  c.drawPath(path, line)
                  val w = hl * 0.55f
                  head.rewind()
                  head.moveTo(e.x, e.y)
                  head.lineTo(bx - uy * w, by + ux * w)
                  head.lineTo(bx + uy * w, by - ux * w)
                  head.close()
                  c.drawPath(head, fill)
              }

              override fun onDraw(c: Canvas) {
                  for (a in arrows) drawArr(c, a.pts, a.color, 255)
                  cur?.let { drawArr(c, it, colors[colorIdx], 140) }
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Chess Draw #${{ github.run_number }}" --notes "APK"
