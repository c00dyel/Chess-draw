          package com.chessdraw

          import android.animation.TimeInterpolator
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.LinearInterpolator
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import kotlin.math.*

          // Jelly / liquid spring on any view: swell on press, wobble back on release
          class Jelly(private val v: View, private val peak: Float = 1.22f, private val minAmp: Float = 0.14f) {
              private var anim: ValueAnimator? = null

              private fun ring(t: Float, w: Float): Float = exp(-5.5f * t) * cos(w * t)

              fun press() {
                  anim?.cancel()
                  v.animate().cancel()
                  v.animate().scaleX(peak).scaleY(peak).setDuration(130).setInterpolator(OvershootInterpolator(2f)).start()
              }

              fun release(base: Float) {
                  anim?.cancel()
                  v.animate().cancel()
                  val ax = max(v.scaleX - base, minAmp)
                  val ay = max(v.scaleY - base, minAmp)
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 700
                  a.addUpdateListener {
                      val t = it.animatedValue as Float
                      v.scaleX = base + ax * ring(t, 14f)
                      v.scaleY = base + ay * ring(t, 17f)
                  }
                  anim = a
                  a.start()
              }
          }

          // Toolbar button with a glass blob behind the icon and liquid animation
          class LiquidButton(c: Context, box: Int, innerPx: Int, val inner: View) : FrameLayout(c) {
              private val glow = View(c)
              private val jelly = Jelly(this)
              private var base = 1f
              private var active = false
              private var moved = false
              private var x0 = 0f
              private var y0 = 0f
              var slop = 8f * c.resources.displayMetrics.density
              var onTap: (() -> Unit)? = null
              var drag: ((MotionEvent, Boolean) -> Unit)? = null

              init {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setGradientType(GradientDrawable.RADIAL_GRADIENT)
                  g.setGradientRadius(box / 2f)
                  g.setColors(intArrayOf(Color.parseColor("#22FFFFFF"), Color.parseColor("#77FFFFFF")))
                  g.setStroke(max(1, box / 28), Color.parseColor("#66FFFFFF"))
                  glow.background = g
                  glow.alpha = 0f
                  addView(glow, FrameLayout.LayoutParams(box, box, Gravity.CENTER))
                  addView(inner, FrameLayout.LayoutParams(innerPx, innerPx, Gravity.CENTER))
              }

              fun setActive(a: Boolean) {
                  active = a
                  base = if (a) 1.12f else 1f
                  glow.animate().alpha(if (a) 0.9f else 0f).setDuration(200).start()
                  animate().scaleX(base).scaleY(base).setDuration(220).setInterpolator(OvershootInterpolator(2f)).start()
              }

              private fun letGo() {
                  glow.animate().alpha(if (active) 0.9f else 0f).setDuration(350).start()
                  jelly.release(base)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          moved = false
                          x0 = e.rawX
                          y0 = e.rawY
                          glow.animate().alpha(1f).setDuration(100).start()
                          jelly.press()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (!moved && hypot(e.rawX - x0, e.rawY - y0) > slop) moved = true
                      }
                      MotionEvent.ACTION_UP -> {
                          letGo()
                          if (!moved && e.x >= 0f && e.y >= 0f && e.x <= width && e.y <= height) onTap?.invoke()
                      }
                      MotionEvent.ACTION_CANCEL -> letGo()
                  }
                  drag?.invoke(e, moved)
                  return true
              }
          }

          class BarItem(val cx: Float, val half: Float, val action: () -> Unit)

          // The whole bottom bar swells like jelly, and a glass blob (magnifying lens)
          // follows the finger and snaps to the icon.
          class LiquidBar(
              c: Context,
              private val crop: Bitmap,
              private val items: List<BarItem>,
              private val corner: Float
          ) : View(c) {
              var ds = 1f
              private val jelly = Jelly(this, 1.04f, 0.035f)
              private val p = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val glassP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rimP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val barClip = Path()
              private val blobPath = Path()
              private val dst = RectF()
              private val oval = RectF()
              private val rimRect = RectF()
              private val mat = Matrix()
              private val glassShader = RadialGradient(
                  0f, 0f, 1f,
                  intArrayOf(Color.parseColor("#00FFFFFF"), Color.parseColor("#00FFFFFF"), Color.parseColor("#77FFFFFF")),
                  floatArrayOf(0f, 0.62f, 1f), Shader.TileMode.CLAMP
              )

              private var blobA = 0f
              private var blobX = 0f
              private var bsx = 1f
              private var bsy = 1f
              private var stretch = 0f
              private var curItem: BarItem? = null
              private var moveAnim: ValueAnimator? = null
              private var blobAnim: ValueAnimator? = null
              private var fadeAnim: ValueAnimator? = null

              init {
                  rimP.style = Paint.Style.STROKE
                  rimP.color = Color.WHITE
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  dst.set(0f, 0f, w.toFloat(), h.toFloat())
                  val sw = 2f * resources.displayMetrics.density
                  rimP.strokeWidth = sw
                  rimRect.set(sw / 2f, sw / 2f, w - sw / 2f, h - sw / 2f)
                  barClip.rewind()
                  barClip.addRoundRect(dst, corner * ds, corner * ds, Path.Direction.CW)
              }

              override fun onDraw(c: Canvas) {
                  val h = height.toFloat()
                  if (blobA > 0.01f) {
                      val cx = blobX * ds
                      val cy = h / 2f
                      val rx = h * 0.50f * bsx * (1f + stretch * 0.35f)
                      val ry = h * 0.43f * bsy * (1f - stretch * 0.12f)
                      oval.set(cx - rx, cy - ry, cx + rx, cy + ry)
                      blobPath.rewind()
                      blobPath.addOval(oval, Path.Direction.CW)
                      c.save()
                      c.clipPath(blobPath)
                      c.translate(cx, cy)
                      c.scale(1.28f, 1.28f)
                      c.translate(-cx, -cy)
                      p.alpha = (blobA * 255f).toInt().coerceIn(0, 255)
                      c.drawBitmap(crop, null, dst, p)
                      c.restore()
                      mat.reset()
                      mat.setScale(rx, ry)
                      mat.postTranslate(cx, cy)
                      glassShader.setLocalMatrix(mat)
                      glassP.shader = glassShader
                      glassP.alpha = (blobA * 255f).toInt().coerceIn(0, 255)
                      c.drawOval(oval, glassP)
                      rimP.alpha = (blobA * 210f).toInt().coerceIn(0, 255)
                      c.drawOval(oval, rimP)
                  }
              }

              private fun go(from: Float, to: Float, ms: Long, delay: Long, ip: TimeInterpolator, upd: (Float) -> Unit): ValueAnimator {
                  val a = ValueAnimator.ofFloat(from, to)
                  a.duration = ms
                  a.startDelay = delay
                  a.interpolator = ip
                  a.addUpdateListener {
                      upd(it.animatedValue as Float)
                      invalidate()
                  }
                  a.start()
                  return a
              }

              private fun popIn() {
                  fadeAnim?.cancel()
                  blobAnim?.cancel()
                  blobA = 1f
                  blobAnim = go(0.55f, 1f, 260L, 0L, OvershootInterpolator(2.2f)) {
                      bsx = it
                      bsy = it
                  }
              }

              private fun wobble() {
                  blobAnim?.cancel()
                  val a0 = max(abs(bsx - 1f), 0.16f)
                  blobAnim = go(0f, 1f, 700L, 0L, LinearInterpolator()) { t ->
                      bsx = 1f + a0 * exp(-5.5f * t) * cos(14f * t)
                      bsy = 1f + a0 * exp(-5.5f * t) * cos(17f * t)
                  }
              }

              private fun fadeBlob(delay: Long) {
                  fadeAnim?.cancel()
                  fadeAnim = go(blobA, 0f, 300L, delay, LinearInterpolator()) { blobA = it }
              }

              private fun moveTo(x: Float) {
                  moveAnim?.cancel()
                  val from = blobX
                  moveAnim = go(0f, 1f, 300L, 0L, OvershootInterpolator(1.3f)) { f ->
                      blobX = from + (x - from) * f
                      stretch = sin(PI.toFloat() * f.coerceIn(0f, 1f))
                  }
              }

              private fun hit(x: Float): BarItem? {
                  val lx = x / ds
                  for (bi in items) {
                      if (abs(lx - bi.cx) <= bi.half) return bi
                  }
                  return null
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          val bi = hit(e.x)
                          curItem = bi
                          moveAnim?.cancel()
                          stretch = 0f
                          blobX = if (bi != null) bi.cx else e.x / ds
                          popIn()
                          jelly.press()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val bi = hit(e.x)
                          if (bi == null) {
                              curItem = null
                              moveAnim?.cancel()
                              blobX = e.x / ds
                              invalidate()
                          } else if (bi !== curItem) {
                              curItem = bi
                              moveTo(bi.cx)
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          val bi = if (e.actionMasked == MotionEvent.ACTION_UP && e.y >= 0f && e.y <= height) hit(e.x) else null
                          if (bi != null && bi !== curItem) {
                              curItem = bi
                              moveTo(bi.cx)
                          }
                          wobble()
                          jelly.release(1f)
                          fadeBlob(350L)
                          if (bi != null) bi.action()
                      }
                  }
                  return true
              }
          }

          // Background: filler texture everywhere, design on top; if the phone is taller
          // than the design the top and bottom edges of the design fade into the filler.
          class ArtView(c: Context, private val art: Bitmap, private val fill: Bitmap, private val iw: Float, private val ih: Float) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val maskP = Paint()
              private val dst = RectF()

              init {
                  maskP.xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_IN)
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val fs = max(w / fill.width, h / fill.height)
                  val fw = fill.width * fs
                  val fh = fill.height * fs
                  dst.set((w - fw) / 2f, (h - fh) / 2f, (w + fw) / 2f, (h + fh) / 2f)
                  c.drawBitmap(fill, null, dst, p)
                  val s = min(w / iw, h / ih)
                  val dw = iw * s
                  val dh = ih * s
                  val ox = (w - dw) / 2f
                  val oy = (h - dh) / 2f
                  dst.set(ox, oy, ox + dw, oy + dh)
                  if (oy > 1f) {
                      val sc = c.saveLayer(0f, 0f, w, h, null)
                      c.drawBitmap(art, null, dst, p)
                      val fr = min(0.45f, 160f * s / dh)
                      maskP.shader = LinearGradient(
                          0f, oy, 0f, oy + dh,
                          intArrayOf(Color.TRANSPARENT, Color.BLACK, Color.BLACK, Color.TRANSPARENT),
                          floatArrayOf(0f, fr, 1f - fr, 1f), Shader.TileMode.CLAMP
                      )
                      c.drawRect(0f, oy, w, oy + dh, maskP)
                      c.restoreToCount(sc)
                  } else {
                      c.drawBitmap(art, null, dst, p)
                  }
              }
          }

          // Design is 1080 wide; the bar sits on top of the baked-in bar and its icons.
          class Stage(c: Context) : FrameLayout(c) {
              private val iw = 1080f
              private var ih = 2160f
              private var art: Bitmap? = null
              private var artView: ArtView? = null
              private var bar: LiquidBar? = null
              private val barBox = FloatArray(4)

              init {
                  setBackgroundColor(Color.BLACK)
              }

              fun setArt(b: Bitmap, fill: Bitmap) {
                  art = b
                  ih = iw * b.height / b.width
                  val av = ArtView(context, b, fill, iw, ih)
                  artView = av
                  addView(av)
              }

              fun setBar(left: Float, top: Float, right: Float, bottom: Float, corner: Float, items: List<BarItem>) {
                  val b = art ?: return
                  val k = b.width / iw
                  val x = (left * k).toInt().coerceIn(0, b.width - 2)
                  val y = (top * k).toInt().coerceIn(0, b.height - 2)
                  val w = ((right - left) * k).toInt().coerceAtMost(b.width - x)
                  val h = ((bottom - top) * k).toInt().coerceAtMost(b.height - y)
                  val crop = Bitmap.createBitmap(b, x, y, w, h)
                  val local = items.map { BarItem(it.cx - left, it.half, it.action) }
                  val lb = LiquidBar(context, crop, local, corner)
                  bar = lb
                  barBox[0] = left
                  barBox[1] = top
                  barBox[2] = right
                  barBox[3] = bottom
                  addView(lb)
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(MeasureSpec.getSize(w), MeasureSpec.getSize(h))
              }

              override fun onLayout(changed: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val w = r - l
                  val h = b - t
                  val av = artView
                  if (av != null) {
                      av.measure(MeasureSpec.makeMeasureSpec(w, MeasureSpec.EXACTLY), MeasureSpec.makeMeasureSpec(h, MeasureSpec.EXACTLY))
                      av.layout(0, 0, w, h)
                  }
                  val s = min(w / iw, h / ih)
                  val ox = (w - iw * s) / 2f
                  val oy = (h - ih * s) / 2f
                  val lb = bar
                  if (lb != null) {
                      val x1 = (ox + barBox[0] * s).toInt()
                      val y1 = (oy + barBox[1] * s).toInt()
                      val x2 = (ox + barBox[2] * s).toInt()
                      val y2 = (oy + barBox[3] * s).toInt()
                      lb.ds = s
                      lb.measure(MeasureSpec.makeMeasureSpec(x2 - x1, MeasureSpec.EXACTLY), MeasureSpec.makeMeasureSpec(y2 - y1, MeasureSpec.EXACTLY))
                      lb.layout(x1, y1, x2, y2)
                  }
              }
          }
